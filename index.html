
<!DOCTYPE html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>O&A Elite Pro - Champions Edition</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C8102E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "firebase/app": "https://esm.sh/firebase@10.7.1/app",
    "firebase/auth": "https://esm.sh/firebase@10.7.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.7.1/firestore",
    "firebase/messaging": "https://esm.sh/firebase@10.7.1/messaging",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary": "#C8102E",
              "primary-bright": "#E10600",
              "navy": "#0033A0",
              "navy-bright": "#1D4ED8",
              "slate-bg": "#F9FBFF",
              "glass-white": "rgba(255, 255, 255, 0.65)"
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"],
              "condensed": ["Bebas Neue", "sans-serif"],
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
              'premium': '0 20px 40px -10px rgba(0, 51, 160, 0.12)',
              'red-glow': '0 0 20px rgba(200, 16, 46, 0.3)',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
              'ripple': 'ripple 0.6s linear',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              pulseSoft: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0.6' } },
              ripple: { '0%': { transform: 'scale(0)', opacity: '0.5' }, '100%': { transform: 'scale(4)', opacity: '0' } }
            }
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .glass-panel {
          @apply bg-glass-white backdrop-blur-[24px] border border-white/60 shadow-glass;
        }
        .bg-champions {
          background: linear-gradient(180deg, #F9FBFF 0%, #EEF3FA 60%, #E8EDF6 100%);
          min-height: 100vh;
        }
        .btn-champions-red {
          background: linear-gradient(135deg, #C8102E 0%, #E10600 100%);
          @apply text-white shadow-premium active:scale-95 transition-all duration-300;
        }
        .btn-champions-blue {
          background: linear-gradient(135deg, #0033A0 0%, #1D4ED8 100%);
          @apply text-white shadow-premium active:scale-95 transition-all duration-300;
        }
      }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      * { -webkit-tap-highlight-color: transparent; }
      body {
        @apply bg-champions font-display text-slate-900 antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
