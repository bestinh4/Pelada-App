
<!DOCTYPE html>
<html lang="pt-BR" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>O&A Elite Pro - Champions Legacy</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C8102E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "firebase/app": "https://esm.sh/firebase@10.7.1/app",
    "firebase/auth": "https://esm.sh/firebase@10.7.1/auth",
    "firebase/firestore": "https://esm.sh/firebase@10.7.1/firestore",
    "firebase/messaging": "https://esm.sh/firebase@10.7.1/messaging",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary": "#C8102E",
              "primary-bright": "#E10600",
              "navy": "#0033A0",
              "navy-deep": "#002166",
              "slate-bg": "#F9FBFF",
              "glass-card": "rgba(255, 255, 255, 0.7)",
              "glass-border": "rgba(255, 255, 255, 0.6)",
              "success": "#10B981"
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"],
              "condensed": ["Bebas Neue", "sans-serif"],
            },
            boxShadow: {
              'elite': '0 10px 40px -10px rgba(0, 51, 160, 0.08)',
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.05)',
              'glow-red': '0 0 20px rgba(200, 16, 46, 0.25)',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
              'float': 'float 3s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(24px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              pulseGlow: { '0%, 100%': { opacity: '1', filter: 'drop-shadow(0 0 5px rgba(200, 16, 46, 0.4))' }, '50%': { opacity: '0.7', filter: 'drop-shadow(0 0 15px rgba(200, 16, 46, 0.15))' } },
              float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } }
            }
          },
        },
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .glass-surface {
          @apply bg-glass-card backdrop-blur-[24px] border border-glass-border shadow-glass;
        }
        .bg-champions-gradient {
          background: linear-gradient(180deg, #F9FBFF 0%, #EEF3FA 60%, #E8EDF6 100%);
          min-height: 100vh;
        }
        .btn-elite-primary {
          background: linear-gradient(135deg, #C8102E 0%, #E10600 100%);
          @apply text-white shadow-xl shadow-primary/20 active:scale-[0.97] transition-all;
        }
        .btn-elite-secondary {
          background: linear-gradient(135deg, #0033A0 0%, #1D4ED8 100%);
          @apply text-white shadow-xl shadow-navy/20 active:scale-[0.97] transition-all;
        }
      }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      * { -webkit-tap-highlight-color: transparent; }
      body {
        @apply bg-champions-gradient font-display text-slate-900 antialiased overflow-x-hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
